<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaykeryOS - Dashboard</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .dashboard-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .nav-card {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .nav-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MaykeryOS Dashboard</h1>
            <p>Production, Costing, and Storefront Management</p>
        </header>

        <section class="dashboard-nav">
            <a href="/ingredients.html" class="nav-card">
                <h3>Ingredient Ledger</h3>
                <p>Log bulk purchases and track average cost-per-gram.</p>
            </a>
            
            <a href="/recipes.html" class="nav-card">
                <h3>Recipe & COGS Calculator</h3>
                <p>Build formulas and project profit margins.</p>
            </a>

            <a href="/markets.html" class="nav-card">
                <h3>Market Profitability</h3>
                <p>Project revenue, packaging costs, and net profit per event.</p>
            </a>
            
        </section>
    </div>
</body>
</html>
