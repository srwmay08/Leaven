<!-- frontend/recipes.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaykeryOS - Recipe Calculator</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Recipe Calculator & COGS</h1>
        </header>

        <!-- Recipe Header Form -->
        <section class="form-section">
            <div id="recipe-header">
                <div class="form-group">
                    <label for="recipe-name">Recipe Name</label>
                    <input type="text" id="recipe-name" placeholder="e.g., Cinnamon Cardamom Bread">
                </div>
                <div class="form-group">
                    <label for="yield-qty">Quantity Made (Batch Yield)</label>
                    <input type="number" id="yield-qty" min="1" value="4">
                </div>
            </div>
        </section>

        <!-- Dynamic Ingredients List -->
        <section class="table-section">
            <table id="recipe-ingredients-table">
                <thead>
                    <tr>
                        <th>Ingredient</th>
                        <th>Grams Used</th>
                        <th>Cost ($/G)</th>
                        <th>Line Cost</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="recipe-tbody">
                    <!-- Dynamic rows inserted here -->
                </tbody>
            </table>
            <button id="add-ingredient-btn" class="btn-secondary">+ Add Ingredient</button>
        </section>

        <!-- Cost & Profit Summary -->
        <section class="summary-section">
            <div class="summary-card">
                <h3>Costing Summary</h3>
                <p>Cost per Batch: <span id="batch-cost">$0.00</span></p>
                <p>Cost per Unit (COGS): <span id="unit-cost">$0.00</span></p>
            </div>
            
            <div class="summary-card">
                <h3>Profit Margin Projection</h3>
                <div class="form-group">
                    <label for="sale-price">Sale Price ($)</label>
                    <input type="number" id="sale-price" step="0.01" value="9.00">
                </div>
                <div class="form-group">
                    <label for="packaging-cost">Packaging Cost ($)</label>
                    <input type="number" id="packaging-cost" step="0.01" value="0.00">
                </div>
                <div class="form-group">
                    <label for="taxes">Taxes ($)</label>
                    <input type="number" id="taxes" step="0.01" value="0.72">
                </div>
                <p><strong>Estimated Profit: <span id="estimated-profit">$0.00</span></strong></p>
            </div>
            
            <button id="save-recipe-btn" class="btn-primary" style="margin-top: 20px;">Save Recipe to Database</button>
        </section>
    </div>
    
    <script src="js/recipes.js"></script>
</body>
</html>
