<!-- frontend/markets.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaykeryOS - Event Ledger</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .table-input { width: 70px; padding: 5px; }
        .event-header { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Event Ledger & Profitability</h1>
        </header>

        <section class="form-section">
            <div class="event-header">
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" id="event-name" required placeholder="e.g., OkTupperFest">
                </div>
                <div class="form-group">
                    <label>Event Date</label>
                    <input type="date" id="event-date" required>
                </div>
            </div>
            
            <table id="market-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Qty Made</th>
                        <th>Qty Sold</th>
                        <th>Revenue</th>
                        <th>Cost (Made)</th>
                        <th>Net Profit</th>
                    </tr>
                </thead>
                <tbody id="market-tbody">
                    <!-- Rows populated dynamically by JS -->
                </tbody>
                <tfoot>
                    <tr style="font-weight: bold; background: var(--bg-color);">
                        <td>Totals</td>
                        <td id="total-made">0</td>
                        <td id="total-sold">0</td>
                        <td id="total-revenue">$0.00</td>
                        <td id="total-cost">$0.00</td>
                        <td id="total-profit">$0.00</td>
                    </tr>
                </tfoot>
            </table>
            
            <button id="save-event-btn" class="btn-primary" style="margin-top: 20px;">Save Event to Calendar</button>
            <p id="save-status" style="margin-top: 10px; color: green; font-weight: bold;"></p>
        </section>
    </div>
    
    <script src="js/markets.js"></script>
</body>
</html>
